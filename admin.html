<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · AIBA CMS</title>
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=5">
<link rel="stylesheet" href="assets/css/admin.css?v=2">
</head>
<body style="background:var(--cream)">

<div class="admin-login" id="loginView">
  <div class="admin-login-card">
    <img src="assets/img/logo.png" alt="" width="48" height="48">
    <h1>AIBA CMS</h1>
    <p>Sign in to manage the E-Board, members, and events.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark" type="submit" id="loginSubmitBtn" style="width:100%;justify-content:center">
        <span class="admin-spinner" id="loginSpinner" hidden></span>
        <span id="loginSubmitLabel">Sign in</span>
      </button>
      <p id="loginError" class="admin-error" hidden></p>
      <p id="loginChecking" class="admin-checking" hidden><span class="admin-spinner"></span> Checking your session…</p>
    </form>
  </div>
</div>

<script type="module" src="assets/js/admin-login.js?v=2"></script>
</body>
</html>
